document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 700;\n  font-display: swap;\n  src: url(\"ff7ccb3d-5afa-46df-b7bc-537b8f8305ae\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"62395991-0a29-45a0-8710-63c56dafa6e2\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ec05f3f2-5c5f-4a11-bd28-0887c577f6d7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"44bc023f-9946-4b5e-9b0c-6d6364187823\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:foc n srgb, var(--color-text) 5%, transparent);border-radius:var(--radius-md);padding:var(--space-3);\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px;\" id=\"bdg\"><\u002Fdiv>\n              <div style=\"margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;flex-wrap:wrap;gap:6px;\">\n                <span>Total: <span id=\"totH\" style=\"color:var(--color-accent);\">0<\u002Fspan>h<\u002Fspan>\n                <span class=\"tag tag-outline\">Free: <span id=\"freeH\">0<\u002Fspan>h<\u002Fspan>\n                <span class=\"tag tag-accent\" id=\"schRecordedTag\">Recorded study: <span id=\"schRecorded\">0<\u002Fspan> min<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary btn-block\" data-onclick=\"toggleSchForm()\"><i class=\"ph ph-plus\"><\u002Fi>Add Schedule Entry<\u002Fbutton>\n            <div id=\"schEntryModal\" class=\"dialog-backdrop\" style=\"display:none;\">\n            <div class=\"dialog\" style=\"max-width:480px;width:100%;\">\n              <div class=\"dialog-title\">Add Schedule Entry<span style=\"cursor:pointer;margin-left:auto;font-size:20px;line-height:1;\" data-onclick=\"closeSchModal()\">×<\u002Fspan><\u002Fdiv>\n              <div class=\"dialog-body\" style=\"display:flex;flex-direction:column;gap:12px;\">\n                <div class=\"field\"><label>Label / Name *<\u002Flabel><input type=\"text\" id=\"schActivity\" class=\"input\" placeholder=\"CS201 Lecture, Work Shift, Study Session...\"><\u002Fdiv>\n                <div class=\"field\"><label>Type<\u002Flabel><sc-raw-select id=\"schTypeSel\" class=\"input\"><\u002Fsc-raw-select><\u002Fdiv>\n                <div class=\"field\"><label>Course (optional)<\u002Flabel><sc-raw-select id=\"schCourseSel\" class=\"input\"><option value=\"\">None / Not linked<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <div class=\"field\" id=\"schDaySelWrap\"><label>Day<\u002Flabel><sc-raw-select id=\"schDaySel\" class=\"input\"><\u002Fsc-raw-select><\u002Fdiv>\n                <div class=\"field\" id=\"schOnceDateWrap\" style=\"display:none;\"><label>Date<\u002Flabel><input type=\"date\" id=\"schOnceDate\" class=\"input\"><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n                  <div class=\"field\"><label>Start *<\u002Flabel><div id=\"schStartPicker\" style=\"display:flex;gap:4px;flex-wrap:nowrap;\"><\u002Fdiv><\u002Fdiv>\n                  <div class=\"field\"><label>End *<\u002Flabel><div id=\"schEndPicker\" style=\"display:flex;gap:4px;flex-wrap:nowrap;\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"field\"><label>Location (optional)<\u002Flabel><input type=\"text\" id=\"schLocation\" class=\"input\" placeholder=\"Room 204...\"><\u002Fdiv>\n                <div class=\"field\"><label>Reminder (optional)<\u002Flabel><sc-raw-select id=\"schRemind\" class=\"input\"><option value=\"0\">No reminder<\u002Foption><option value=\"5\">5 min before<\u002Foption><option value=\"10\">10 min before<\u002Foption><option value=\"15\">15 min before<\u002Foption><option value=\"30\">30 min before<\u002Foption><option value=\"60\">1 hr before<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <div class=\"field\"><label>Repeat<\u002Flabel><div id=\"schRepeatG\" style=\"display:flex;gap:6px;\"><span class=\"tag tag-select\" style=\"cursor:pointer;\" data-onclick=\"togSel(this);toggleSchDaysWrap(this)\">Once<\u002Fspan><span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"togSel(this);toggleSchDaysWrap(this)\">Daily<\u002Fspan><span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"togSel(this);toggleSchDaysWrap(this)\">Weekly<\u002Fspan><\u002Fdiv><\u002Fdiv>\n                <div class=\"field\" id=\"schDaysWrap\" style=\"display:none;\">\n                  <label>Which day(s)? (e.g. pick just Sunday to repeat every Sunday)<\u002Flabel>\n                  <div id=\"schDaysG\" style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n                    <span class=\"tag tag-outline\" data-day=\"1\" style=\"cursor:pointer;\" data-onclick=\"toggleDayChip(this)\">Mon<\u002Fspan>\n                    <span class=\"tag tag-outline\" data-day=\"2\" style=\"cursor:pointer;\" data-onclick=\"toggleDayChip(this)\">Tue<\u002Fspan>\n                    <span class=\"tag tag-outline\" data-day=\"3\" style=\"cursor:pointer;\" data-onclick=\"toggleDayChip(this)\">Wed<\u002Fspan>\n                    <span class=\"tag tag-outline\" data-day=\"4\" style=\"cursor:pointer;\" data-onclick=\"toggleDayChip(this)\">Thu<\u002Fspan>\n                    <span class=\"tag tag-outline\" data-day=\"5\" style=\"cursor:pointer;\" data-onclick=\"toggleDayChip(this)\">Fri<\u002Fspan>\n                    <span class=\"tag tag-outline\" data-day=\"6\" style=\"cursor:pointer;\" data-onclick=\"toggleDayChip(this)\">Sat<\u002Fspan>\n                    <span class=\"tag tag-outline\" data-day=\"0\" style=\"cursor:pointer;\" data-onclick=\"toggleDayChip(this)\">Sun<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div id=\"schFormMsg\" style=\"font-size:11px;color:#d33;min-height:14px;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"dialog-actions\">\n                <button class=\"btn btn-primary btn-block\" data-onclick=\"addSchedule()\">Add to Schedule<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"schList\"><\u002Fdiv>\n            <div style=\"display:flex;gap:6px;margin-top:4px;\">\n              <button class=\"btn btn-secondary\" style=\"flex:1;\" data-onclick=\"rstSch()\"><i class=\"ph ph-arrow-counter-clockwise\"><\u002Fi>Reset Day<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\" >Practice Mode<\u002Fbutton>\n            <div id=\"fcPractice\"><\u002Fdiv>\n            <div id=\"fcList\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"tab-exams\" class=\"hidden\">\n          <div class=\"card\" style=\"max-width:700px;margin:0 auto;\">\n            <div class=\"card-title\" id=\"examTabTitle\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-note-pencil\" style=\"color:var(--color-accent);\"><\u002Fi>Exam Timetable<\u002Fdiv>\n            <button class=\"btn btn-primary btn-block\" data-onclick=\"openExamModal()\" id=\"examAddBtn\"><i class=\"ph ph-plus\"><\u002Fi>Add Exam<\u002Fbutton>\n            <div id=\"examList\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"tab-classes\" class=\"hidden\">\n          <div class=\"card\" style=\"max-width:700px;margin:0 auto;\">\n            <div class=\"card-title\" id=\"clsTabTitle\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-chalkboard-teacher\" style=\"color:var(--color-accent);\"><\u002Fi>My Classes<\u002Fdiv>\n            <button class=\"btn btn-primary btn-block\" data-onclick=\"openClassModal()\" id=\"clsAddBtn\"><i class=\"ph ph-plus\"><\u002Fi>Add Class<\u002Fbutton>\n            <div id=\"classList\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"tab-review\" class=\"hidden\">\n          <div class=\"card\" style=\"max-width:700px;margin:0 auto;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-note\" style=\"color:var(--color-accent);\"><\u002Fi>End of Day Report<span class=\"tag tag-outline\" style=\"margin-left:auto;\">AI<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11.5px;opacity:.7;\">Pulls today's task comments and ratings, and suggests a corrective action to stop repeat problems.<\u002Fdiv>\n            <button class=\"btn btn-secondary\ x-width:700px;margin:var(--space-4) auto 0;text-align:center;\">\n            <div class=\"card-title\" style=\"justify-content:center;font-size:15px;\"><i class=\"ph ph-confetti\" style=\"color:var(--color-accent);\"><\u002Fi><span id=\"wrappedTitleTxt\">Semester Wrapped<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11.5px;opacity:.7;\" id=\"wrappedSubTxt\">A quick, shareable recap of your semester so far.<\u002Fdiv>\n            <button class=\"btn btn-primary\" style=\"align-self:center;\" data-onclick=\"openWrapped()\"><i class=\"ph ph-play\"><\u002Fi>View My Wrapped<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"tab-fitness\" class=\"hidden\">\n          <div class=\"card\" style=\"max-width:700px;margin:0 auto;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-barbell\" style=\"color:var(--color-accent);\"><\u002Fi>Fitness<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px;\" id=\"fitStats\"><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n              <div class=\"field\"><label>Activity *<\u002Flabel><input type=\"text\" id=\"fitActivity\" class=\"input\" placeholder=\"e.g. Running, Gym, Yoga\"><\u002Fdiv>\n              <div class=\"field\"><label>Duration (min) *<\u002Flabel><input type=\"number\" id=\"fitDuration\" class=\"input\" placeholder=\"30\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n              <div class=\"field\"><label>Type<\u002Flabel><div id=\"fitTypeG\" style=\"display:flex;gap:6px;flex-wrap:wrap;\"><span class=\"tag tag-select\" style=\"cursor:pointer;\" data-onclick=\"togSel(this)\">Cardio<\u002Fspan><span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"togSel(this)\">Strength<\u002Fspan><span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"togSel(this)\">Yoga<\u002Fspan><span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"togSel(this)\">Sports<\u002Fspan><span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"togSel(this)\">Other<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div class=\"field\"><label>Date<\u002Flabel><input type=\"date\" id=\"fitDate\" class=\"input\"><\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary btn-block\" data-onclick=\"saveFitness()\">Log Workout<\u002Fbutton>\n            <div id=\"fitChart\" style=\"margin:4px 0;\"><\u002Fdiv>\n            <div id=\"fitList\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"max-width:700px;margin:var(--space-4) auto 0;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-ruler\" style=\"color:var(--color-accent);\"><\u002Fi>Body Measurements<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;\">\n              <div class=\"field\"><label>Weight (kg)<\u002Flabel><input type=\"number\" step=\"0.1\" id=\"measWeight\" class=\"input\" placeholder=\"e.g. 68.5\"><\u002Fdiv>\n              <div class=\"field\"><label>Waist (cm)<\u002Flabel><input type=\"number\" step=\"0.1\" id=\"measWaist\" class=\"input\" placeholder=\"optional\"><\u002Fdiv>\n              <div class=\"field\"><label>Date<\u002Flabel><input type=\"date\" id=\"measDate\" class=\"input\"><\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary btn-block\" data-onclick=\"saveMeasurement()\">Log Measurement<\u002Fbutton>\n            <div id=\"measChart\" style=\"margin:4px 0;\"><\u002Fdiv>\n            <div id=\"measList\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"tab-reminders\" class=\"hidden\">\n          <div class=\"card\" style=\"max-width:700px;margin:0 auto;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-bell-ringing\" style=\"color:var(--color-accent);\"><\u002Fi>Upcoming Reminders<\u002Fdiv>\n            <div style=\"font-size:11.5px;opacity:.7;\">Everything you have set a reminder for, soonest first.<\u002Fdiv>\n            <div id=\"remindersList\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"tab-settings\" class=\"hidden\">\n          <div class=\"card\" style=\"max-width:700px;margin:0 auto;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-user-gear\" style=\"color:var(--color-accent);\"><\u002Fi>Planner Profile<\u002Fdiv>\n            <div class=\"field\"><label>What do you use this planner for?<\u002Flabel>\n              <div id=\"settingsProfileG\" style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n                <span class=\"tag tag-accent\" style=\"cursor:pointer;\" data-onclick=\"setProfile('student',this)\">🎓 Student<\u002Fspan>\n                <span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"setProfile('office',this)\">💼 Office Professional<\u002Fspan>\n                <span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"setProfile('business',this)\">📈 Business Owner<\u002Fspan>\n                <span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"setProfile('construction',this)\">🛠️ Skilled Trade / Construction<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"max-width:700px;margin:var(--space-4) auto 0;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-palette\" style=\"color:var(--color-accent);\"><\u002Fi>Appearance<\u002Fdiv>\n            <div class=\"field\"><label>Mode<\u002Flabel>\n              <div id=\"settingsModeG\" style=\"display:flex;gap:6px;\">\n                <span class=\"tag tag-accent\" style=\"cursor:pointer;\" data-onclick=\"setAppearance('mode','light',this)\">Light<\u002Fspan>\n                <span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"setAppearance('mode','dark',this)\">Dark<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Accent colour<\u002Flabel>\n              <div id=\"settingsColorG\" style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n                <span data-color=\"blue\" style=\"width:26px;height:26px;border-radius:50%;background:#2f8aef;cursor:pointer;\" data-onclick=\"setAppearance('color','blue',this)\"><\u002Fspan>\n                <span data-color=\"violet\" style=\"width:26px;height:26px;border-radius:50%;background:#7c5ce8;cursor:pointer;\" data-onclick=\"setAppearance('color','violet',this)\"><\u002Fspan>\n                <span data-color=\"green\" style=\"width:26px;height:26px;border-radius:50%;background:#1f9d54;cursor:pointer;\" data-onclick=\"setAppearance('color','green',this)\"><\u002Fspan>\n                <span data-color=\"coral\" style=\"width:26px;height:26px;border-radius:50%;background:#e8623d;cursor:pointer;\" data-onclick=\"setAppearance('color','coral',this)\"><\u002Fspan>\n                <span data-color=\"teal\" style=\"width:26px;height:26px;border-radius:50%;background:#159089;cursor:pointer;\" data-onclick=\"setAppearance('color','teal',this)\"><\u002Fspan>\n                <span data-color=\"neon\" style=\"width:26px;height:26px;border-radius:50%;background:#0a0e16;border:1px solid #26d3e0;cursor:pointer;\" data-onclick=\"setAppearance('color','neon',this)\"><\u002Fspan>\n                <span data-color=\"magenta\" style=\"width:26px;height:26px;border-radius:50%;background:#0a0e16;border:1px solid #e847c9;cursor:pointer;\" data-onclick=\"setAppearance('color','magenta',this)\"><\u002Fspan>\n                <span data-color=\"amber-neon\" style=\"width:26px;height:26px;border-radius:50%;background:#0a0e16;border:1px solid #f5b83d;cursor:pointer;\" data-onclick=\"setAppearance('color','amber-neon',this)\"><\u002Fspan>\n                <span data-color=\"lime-neon\" style=\"width:26px;height:26px;border-radius:50%;background:#0a0e16;border:1px solid #a3e635;cursor:pointer;\" data-onclick=\"setAppearance('color','lime-neon',this)\"><\u002Fspan>\n                <span data-color=\"rose\" style=\"width:26px;height:26px;border-radius:50%;background:#e0457a;cursor:pointer;\" data-onclick=\"setAppearance('color','rose',this)\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Font<\u002Flabel>\n              <div id=\"settingsFontG\" style=\"display:flex;gap:6px;\">\n                <span class=\"tag tag-accent\" style=\"cursor:pointer;font-family:system-ui,sans-serif;\" data-onclick=\"setAppearance('font','sans',this)\">Sans<\u002Fspan>\n                <span class=\"tag tag-outline\" style=\"cursor:pointer;font-family:Georgia,serif;\" data-onclick=\"setAppearance('font','serif',this)\">Serif<\u002Fspan>\n                <span class=\"tag tag-outline\" style=\"cursor:pointer;font-family:ui-rounded,system-ui,sans-serif;\" data-onclick=\"setAppearance('font','rounded',this)\">Rounded<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Density<\u002Flabel>\n              <div id=\"settingsDensityG\" style=\"display:flex;gap:6px;\">\n                <span class=\"tag tag-accent\" style=\"cursor:pointer;\" data-onclick=\"setAppearance('density','cozy',this)\">Cozy<\u002Fspan>\n                <span class=\"tag tag-outline\" style=\"cursor:pointer;\" data-onclick=\"setAppearance('density','compact',this)\">Compact<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"max-width:700px;margin:var(--space-4) auto 0;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-toggle-right\" style=\"color:var(--color-accent);\"><\u002Fi>Extra Features<\u002Fdiv>\n            <label class=\"radio\" style=\"cursor:pointer;\"><input type=\"checkbox\" id=\"featConfetti\" data-onchange=\"saveFeatureToggles()\"><span class=\"dot\" style=\"border-radius:var(--radius-sm);\"><\u002Fspan>Confetti when you complete all tasks for the day<\u002Flabel>\n            <label class=\"radio\" style=\"cursor:pointer;\"><input type=\"checkbox\" id=\"featSound\" data-onchange=\"saveFeatureToggles()\"><span class=\"dot\" style=\"border-radius:var(--radius-sm);\"><\u002Fspan>Soft sound on timer completion<\u002Flabel>\n            <label class=\"radio\" style=\"cursor:pointer;\"><input type=\"checkbox\" id=\"featCompactCards\" data-onchange=\"saveFeatureToggles()\"><span class=\"dot\" style=\"border-radius:var(--radius-sm);\"><\u002Fspan>Compact card view on Dashboard<\u002Flabel>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"max-width:700px;margin:var(--space-4) auto 0;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-bell-ringing\" style=\"color:var(--color-accent);\"><\u002Fi>Reminders<\u002Fdiv>\n            <div style=\"font-size:11.5px;opacity:.7;\">Get a browser notification once a day while this tab is open. Requires notification permission on this device.<\u002Fdiv>\n            <label class=\"radio\" style=\"cursor:pointer;\"><input type=\"checkbox\" id=\"remEnabled\" data-onchange=\"saveReminderSettings()\"><span class=\"dot\" style=\"border-radius:var(--radius-sm);\"><\u002Fspan>Enable daily reminder<\u002Flabel>\n            <div class=\"field\" style=\"max-width:180px;\"><label>Reminder time<\u002Flabel><input type=\"time\" id=\"remTime\" class=\"input\" value=\"08:00\" data-onchange=\"saveReminderSettings()\"><\u002Fdiv>\n            <div id=\"remStatusMsg\" style=\"font-size:11px;opacity:.65;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"max-width:700px;margin:var(--space-4) auto 0;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-calendar-plus\" style=\"color:var(--color-accent);\"><\u002Fi>Calendar Sync<\u002Fdiv>\n            <div style=\"font-size:11.5px;opacity:.7;\">Export this week's schedule as a calendar file, then import it into Google Calendar, Apple Calendar, or Outlook. One-way export — re-export after schedule changes.<\u002Fdiv>\n            <button class=\"btn btn-secondary btn-block\" data-onclick=\"exportIcs()\"><i class=\"ph ph-download-simple\"><\u002Fi>Download Week (.ics)<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"max-width:700px;margin:var(--space-4) auto 0;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-robot\" style=\"color:var(--color-accent);\"><\u002Fi>AI Provider<span class=\"tag tag-outline\" id=\"aiStatusTagSettings\" style=\"margin-left:auto;\">Checking…<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11.5px;opacity:.7;\">Log in with your own AI provider account's API key. Your key stays on this device — features route directly to that company's API.<\u002Fdiv>\n            <div class=\"field\"><label>Provider<\u002Flabel>\n              <sc-raw-select id=\"aiProvider\" class=\"input\" data-onchange=\"onAiProviderChange()\">\n                <option value=\"anthropic\">Anthropic (Claude)<\u002Foption>\n                <option value=\"openai\">OpenAI (GPT)<\u002Foption>\n                <option value=\"google\">Google (Gemini)<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\"><label>API Key<\u002Flabel><input type=\"password\" id=\"aiKeyInput\" class=\"input\" placeholder=\"Paste your API key\"><\u002Fdiv>\n            <div style=\"display:flex;gap:6px;\">\n              <button class=\"btn btn-primary\" data-onclick=\"saveAiKey()\">Save &amp; Connect<\u002Fbutton>\n              <button class=\"btn btn-ghost\" data-onclick=\"clearAiKey()\">Disconnect<\u002Fbutton>\n            <\u002Fdiv>\n            <a href=\"#\" id=\"aiProviderKeyLink\" target=\"_blank\" style=\"font-size:11px;\">Get an API key<\u002Fa>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"max-width:700px;margin:var(--space-4) auto 0;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-user-circle\" style=\"color:var(--color-accent);\"><\u002Fi>Account<\u002Fdiv>\n            <div id=\"settingsAccountInfo\" style=\"font-size:12.5px;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"tab-help\" class=\"hidden\">\n          <div class=\"card\" style=\"max-width:700px;margin:0 auto;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-question\" style=\"color:var(--color-accent);\"><\u002Fi>Frequently Asked Questions<\u002Fdiv>\n            <input type=\"text\" id=\"faqSearch\" class=\"input\" placeholder=\"Search questions...\" data-oninput=\"renderFaq()\">\n            <div id=\"faqList\" style=\"display:flex;flex-direction:column;gap:6px;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"max-width:700px;margin:var(--space-4) auto 0;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-lifebuoy\" style=\"color:var(--color-accent);\"><\u002Fi>Still stuck? Contact support<\u002Fdiv>\n            <div style=\"font-size:11.5px;opacity:.7;\">Have a question or ran into a problem? Send a message below — it goes straight to Mahdi Alizada, the developer of this planner.<\u002Fdiv>\n            <div class=\"field\"><label>Your name (optional)<\u002Flabel><input type=\"text\" id=\"helpName\" class=\"input\" placeholder=\"So we know who's asking\"><\u002Fdiv>\n            <div class=\"field\"><label>Subject *<\u002Flabel><input type=\"text\" id=\"helpSubject\" class=\"input\" placeholder=\"e.g. Can't save my schedule\"><\u002Fdiv>\n            <div class=\"field\"><label>Message *<\u002Flabel><textarea id=\"helpMessage\" class=\"input\" style=\"min-height:100px;\" placeholder=\"Describe your question or issue...\"><\u002Ftextarea><\u002Fdiv>\n            <button class=\"btn btn-primary btn-block\" data-onclick=\"sendHelpMessage()\">Send to Support<\u002Fbutton>\n            <div id=\"helpSentMsg\" style=\"display:none;font-size:12px;font-weight:700;color:#1f9d54;background:#e3f7ea;border-radius:6px;padding:8px 10px;\">Your email app should have opened with your message ready to send.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"tab-habits\" class=\"hidden\">\n          <div class=\"card\" style=\"max-width:700px;margin:0 auto;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-check-circle\" style=\"color:var(--color-accent);\"><\u002Fi>Habit Tracker<\u002Fdiv>\n            <div id=\"habXpBar\"><\u002Fdiv>\n            <div style=\"display:flex;gap:6px;\">\n              <input id=\"habInput\" class=\"input\" placeholder=\"New habit, e.g. Read 20 minutes\">\n              <button class=\"btn btn-secondary\" data-onclick=\"addHabit()\">Add<\u002Fbutton>\n            <\u002Fdiv>\n            <div id=\"habList\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"tab-goals\" class=\"hidden\">\n          <div class=\"card\" style=\"max-width:700px;margin:0 auto;\">\n            <div class=\"card-title\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;\"><i class=\"ph ph-target\" style=\"color:var(--color-accent);\"><\u002Fi>Goals<\u002Fdiv>\n            <div s
